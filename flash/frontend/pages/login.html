<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="/flash/frontend/src/styles/Styles.css"> <!-- Link to your CSS file -->
</head>

<body>
    <div class="input-container">
        <h2>Login</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="username" class="input-label">Username</label>
                <input type="text" id="username" name="username" class="input-field" placeholder="Enter your username"
                    required>
            </div>
            <div class="input-group">
                <label for="password" class="input-label">Password</label>
                <input type="password" id="password" name="password" class="input-field"
                    placeholder="Enter your password" required>
            </div>
            <button class="custombtn" type="submit">
                Login
            </button>
        </form>
    </div>

    <script src="script.js"></script>
</body>

</html>
